name: TGE RDN Scraper
version: "1.0.5"
slug: tge_rdn_scraper
description: Scrapes TGE RDN electricity prices and writes Home Assistant compatible files.
url: https://github.com/ErwinRom/TgeRdn
startup: application
boot: auto
init: false
arch:
  - amd64
  - armv7
  - armhf
  - aarch64
options:
  output_dir: /config/tgerdn
  hour: "00:01,12:01"
schema:
  output_dir: str
  hour: str
map:
  - type: homeassistant_config
    read_only: false
    path: /config